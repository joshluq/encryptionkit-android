name: Publish EncryptionKit Release
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.agents/**'
      - 'docs/**'
      - 'showcase/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    name: Test and Publish Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Test and Publish Release to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          chmod +x gradlew
          ./gradlew test publish -PversionType=""
      - name: Extract Library Version
        id: extract_version
        run: |
          VERSION=$(grep '^libraryVersion=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT
      - name: Create Git Tag & GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.extract_version.outputs.TAG }}
          name: Release ${{ steps.extract_version.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
